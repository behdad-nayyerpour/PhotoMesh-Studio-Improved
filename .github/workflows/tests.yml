# Non-GPU test suite. Lean on purpose (private repo: Actions minutes are limited,
# Windows minutes count double):
# - runs only on push to main and on version tags (v*), Linux only;
# - main + tag pushed together (a release) share one run (same commit);
# - Windows only when started by hand (Actions > Tests > Run workflow > windows).
# COLMAP / GPU / local-data / OpenGL tests are marked and reported as skipped
# (tests/conftest.py: CI_ONLY_LOCAL). The tests themselves run offline (no-network guard).
name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "screenshot*.png", "*.bat"]
  workflow_dispatch:
    inputs:
      windows:
        description: "Also run on Windows (counts 2x minutes)"
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries (Qt offscreen, Open3D)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgomp1
      - name: Install
        run: pip install -q -r requirements-dev.txt psutil
      - name: Reference and Ortho regressions
        timeout-minutes: 3
        run: python -m pytest -vv -o faulthandler_timeout=60 -p no:cacheprovider tests/test_reference_lifecycle.py tests/test_release_0117.py
      - name: Tests (no COLMAP / GPU)
        run: |
          set -o pipefail
          python -m pytest -vv -rs -o faulthandler_timeout=120 -p no:cacheprovider tests 2>&1 | tee pytest.txt
      - name: Summary
        if: always()
        run: |
          { echo '### Tests (Linux)'; echo '```'; grep -E '^(SKIPPED|FAILED|ERROR)|passed|failed' pytest.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -q -r requirements-dev.txt psutil
      - name: Tests (no COLMAP / GPU)
        run: python -m pytest -q -rs -p no:cacheprovider tests
